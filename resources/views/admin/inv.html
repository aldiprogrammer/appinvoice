<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Invoice</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @page {
            size: 21cm 14cm;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
        }

        .invoice-container {
            width: 21cm;
            height: 14cm;
        }
    </style>
</head>

<body class="bg-white">

    <div class="invoice-container p-6 flex flex-col justify-between">

        <!-- Header -->
        <div>
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-xl font-bold">INVOICE</h1>
                    <p class="text-sm text-gray-600">#INV-001</p>
                </div>

                <div class="text-right text-sm">
                    <p class="font-semibold">PT Nusa Digital</p>
                    <p>Jl. Contoh No. 123</p>
                    <p>Medan</p>
                    <p>0812-xxxx-xxxx</p>
                </div>
            </div>

            <!-- Customer Info -->
            <div class="mt-4 text-sm">
                <p><span class="font-semibold">Kepada:</span> Bapak Andi</p>
                <p><span class="font-semibold">Tanggal:</span> 05 Maret 2026</p>
            </div>

            <!-- Table -->
            <div class="mt-4">
                <table class="w-full text-sm border border-gray-400">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="border p-2 text-left">Produk</th>
                            <th class="border p-2 text-center">Qty</th>
                            <th class="border p-2 text-right">Harga</th>
                            <th class="border p-2 text-right">Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="border p-2">Beras Premium 5Kg</td>
                            <td class="border p-2 text-center">2</td>
                            <td class="border p-2 text-right">Rp 75.000</td>
                            <td class="border p-2 text-right">Rp 150.000</td>
                        </tr>
                        <tr>
                            <td class="border p-2">Beras Medium 5Kg</td>
                            <td class="border p-2 text-center">1</td>
                            <td class="border p-2 text-right">Rp 60.000</td>
                            <td class="border p-2 text-right">Rp 60.000</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-sm">
            <div class="flex justify-end">
                <div class="w-1/3">
                    <div class="flex justify-between border-t pt-2">
                        <span class="font-semibold">Grand Total:</span>
                        <span class="font-bold">Rp 210.000</span>
                    </div>
                </div>
            </div>

            <div class="mt-6 text-center text-xs text-gray-500">
                Terima kasih atas kepercayaan Anda
            </div>
        </div>

    </div>

</body>

</html>
